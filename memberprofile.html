<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAYM Member Profile</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:0;
}

header{
    background:#006400;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:800px;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.profile-pic{
    width:120px;
    height:120px;
    border-radius:50%;
    background:#ddd;
    margin:auto;
    display:block;
}

h2{
    text-align:center;
    color:#006400;
}

.info{
    margin-top:20px;
}

.info p{
    font-size:18px;
    padding:10px;
    border-bottom:1px solid #ddd;
}

button{
    background:#006400;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
    margin-top:20px;
}

button:hover{
    background:#004d00;
}
</style>
</head>

<body>

<header>
<h1>United Africa Youths Movement (UAYM)</h1>
<p>Member Profile</p>
</header>

<div class="container">

<img src="https://via.placeholder.com/120" class="profile-pic" alt="Profile">

<h2>Member Information</h2>

<div class="info">
<p><strong>Full Name:</strong> John Doe</p>
<p><strong>Email:</strong> johndoe@email.com</p>
<p><strong>Country:</strong> Nigeria</p>
<p><strong>State:</strong> Enugu</p>
<p><strong>Membership ID:</strong> UAYM001</p>
<p><strong>Status:</strong> Active Member</p>
</div>

<center>
<button>Edit Profile</button>
<button>Logout</button>
</center>

</div>

</body>
</html>
