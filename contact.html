<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact UAYM</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:0;
    background:#f4f4f4;
}

header{
    background:#006400;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:800px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
    color:#006400;
}

input, textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    background:#006400;
    color:white;
    padding:12px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#008000;
}

.footer{
    text-align:center;
    background:#0d1b2a;
    color:white;
    padding:15px;
    margin-top:30px;
}
</style>
</head>

<body>

<header>
    <h1>United Africa Youths Movement (UAYM)</h1>
    <p>Contact Us</p>
</header>

<div class="container">

    <h2>Get In Touch</h2>

    <p>
        Have questions, suggestions, or want to join our movement?
        Send us a message below.
    </p>

    <form>
        <input type="text" placeholder="Your Full Name" required>

        <input type="email" placeholder="Your Email Address" required>

        <textarea rows="6" placeholder="Write your message here..." required></textarea>

        <button type="submit">Send Message</button>
    </form>

</div>

<div class="footer">
    <p>© 2026 United Africa Youths Movement (UAYM). All Rights Reserved.</p>
</div>

</body>
</html>
